# Generates the profile README cards daily and commits them to /profile,
# so the profile README never depends on a rate-limited public server.
#
# - overview-*.svg : contribution overview (incl. private contributions),
#                    built by .github/scripts/overview_card.py — no personal token needed.
# - top-langs-*.svg: most used languages (public repositories).
# - header-*.svg   : custom profile header, built by .github/scripts/make_header.py.

name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-cards.yml"
      - ".github/scripts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMMON: hide_border=true&bg_color=00000000&title_color=2563EB&icon_color=2563EB&ring_color=2563EB
    steps:
      - uses: actions/checkout@v6

      - name: Profile header
        run: python3 .github/scripts/make_header.py profile

      - name: Contribution overview card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/overview_card.py ghouliaras profile

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ghouliaras&layout=compact&langs_count=8&theme=tokyonight&${{ env.COMMON }}
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=ghouliaras&layout=compact&langs_count=8&theme=default&${{ env.COMMON }}
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch profile/stats-dark.svg profile/stats-light.svg
          git add -A profile
          git commit -m "Update README cards" || exit 0
          git push
